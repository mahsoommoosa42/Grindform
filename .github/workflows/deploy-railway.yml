name: Deploy to Railway

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      healthcheck_url:
        description: Public service URL for the post-deploy health check
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test:coverage

      - name: Prettier format check
        run: bun run format:check

      - name: ESLint
        run: bun run lint

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync Python toolchain
        run: cd tools/python && uv sync

      - name: Ruff lint
        run: cd tools/python && uv run ruff check ../..

      - name: Ruff format check
        run: cd tools/python && uv run ruff format --check ../..

      - name: Install Playwright browsers
        run: cd packages/web && bunx playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        run: bun run test:e2e

  deploy:
    name: Deploy grindform-web
    needs: quality
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      HEALTHCHECK_URL: ${{ inputs.healthcheck_url || vars.RAILWAY_HEALTHCHECK_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment configuration
        shell: bash
        run: |
          if [[ -z "${RAILWAY_TOKEN}" ]]; then
            echo "::error::RAILWAY_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "${HEALTHCHECK_URL}" ]]; then
            echo "::error::Set the RAILWAY_HEALTHCHECK_URL repository variable or provide the healthcheck_url workflow input."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway
        run: railway up --service grindform-web --ci

      - name: Wait for health check
        shell: bash
        run: |
          url="${HEALTHCHECK_URL%/}/v1/health"
          for attempt in {1..30}; do
            if response="$(curl --fail --silent --show-error --max-time 10 "${url}")" &&
              grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' <<<"${response}"; then
              echo "Railway deployment is healthy: ${url}"
              exit 0
            fi
            echo "Waiting for Railway deployment health (${attempt}/30)..."
            sleep 10
          done
          echo "::error::Railway deployment did not become healthy at ${url}."
          exit 1
